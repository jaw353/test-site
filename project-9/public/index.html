<!doctype html>
<html lang="en" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#4e2439"><title>L’Oréal | Routine Atelier</title><link rel="stylesheet" href="./style.css"><script type="module" src="./app.js"></script></head>
<body><header><div class="bar"><a href="./" class="logo" aria-label="L’Oréal, home">L’ORÉAL</a><span class="barline"></span><span data-t="atelier">Routine Atelier</span><button id="lang" type="button" lang="ar">العربية</button></div></header>
<main><section class="hero"><div><h1 data-t="title">Build your routine.</h1><p data-t="intro">Choose your skincare products, then shape a routine around the way you use them.</p></div><div class="still" aria-hidden="true"><div class="halo"></div><div id="stillProducts"></div></div></section>
<div class="workspace"><section class="shelf"><h2 data-t="shelf">The product shelf</h2><div class="filters"><input id="search" type="search"><select id="category"></select></div><p id="count" class="meta" role="status"></p><div id="grid"></div></section>
<aside><div class="tray"><h2 data-t="selection">Your selection</h2><div id="picked"></div><div class="clearrow"><button class="link" id="clear"></button></div><label for="goal" data-t="goal">Routine preferences (optional)</label><textarea id="goal" maxlength="500" rows="2"></textarea><button class="primary" id="generate"></button></div></aside></div>
<section class="chat" id="chat"><h2 data-t="chat">Routine conversation</h2><p id="welcome"></p><div id="messages" role="log" aria-live="polite"></div><form id="ask"><label for="question" data-t="ask">Ask about your routine</label><div class="entry"><input id="question" required maxlength="1400"><button id="send" class="primary"></button></div><label class="check"><input type="checkbox" id="web"><span data-t="web">Search current brand guidance and include sources</span></label></form><p id="status" role="status"></p></section></main><footer>Jacob Windsor <span> / </span> <span data-t="footer">Independent student project</span></footer></body></html>
